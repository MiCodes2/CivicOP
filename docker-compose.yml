version: '3.8'

services:
  # PostgreSQL Database with PostGIS
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: civicop
      POSTGRES_USER: civicop_user
      POSTGRES_PASSWORD: civicop_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicop_user -d civicop"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Message Queue (using local Redis server)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6389:6379"
  #   volumes:
  #     - redis_data:/data

  # FastAPI Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://civicop_user:civicop_pass@postgres/civicop
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Celery Worker
  worker:
    build: ./worker
    environment:
      - DATABASE_URL=postgresql://civicop_user:civicop_pass@postgres/civicop
      - REDIS_URL=redis://host.docker.internal:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./worker:/app

  # Next.js Frontend
  frontend:
    build: ./frontend
    ports:
      - "3040:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Nginx API Gateway
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data: